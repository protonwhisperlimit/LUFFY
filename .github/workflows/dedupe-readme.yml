name: Dedupe README TODOs

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [README.md]

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Remove duplicate TODO entries
        run: |
          python - <<'PY'
          import re
          p='README.md'
          lines=open(p, encoding='utf-8').read().splitlines()
          seen=set()
          out=[]
          for line in lines:
              m=re.match(r'^- \[ \] \*\*([^*]+)\*\*', line)
              if m and m.group(1).startswith('luffy/'):
                  key=m.group(1)
                  if key in seen:
                      print('Removing duplicate:', key)
                      continue
                  seen.add(key)
              out.append(line)
          open(p,'w',encoding='utf-8').write('\n'.join(out)+'\n')
          PY
      - name: Commit README changes
        run: |
          if git diff --quiet README.md; then
            echo "No README changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: dedupe Complete TODO List"
          git push origin HEAD:dev
